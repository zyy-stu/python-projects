[project]
name = "python-projects-tutorials"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["beginner/03-todo-cli/tests", "templates/basic-project-template/tests", "templates/standard-project-template/tests", "templates/advanced-project-template/tests"]
